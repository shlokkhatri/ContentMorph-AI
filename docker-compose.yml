# OPTIONAL: run PostgreSQL locally with Docker instead of installing it manually.
# Start it with:  docker compose up -d
# Then use this DATABASE_URL in backend/.env:
#   postgresql://postgres:postgres@localhost:5432/content_platform

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
